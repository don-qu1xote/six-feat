[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    status_endpoint: тесты /api/v1/status (маркер сохранён для обратной совместимости фильтрации)
    health_endpoint: тесты /healthz (маркер сохранён для обратной совместимости фильтрации)
    integration: требует запущенного бинарника сервиса
    unit: чистые Python-юнит-тесты, без бинарника
    sse_endpoint: тесты /api/v1/status/stream SSE (долгие потоковые)
    static_headers: тесты security-заголовков статики (/, /script.js)
    bg_profile: тесты второго инстанса service_proc_bg (BG-enrichment, circuit breaker, retry/backoff)
    image_proxy_endpoint: тесты /api/v1/image (same-origin прокси CDN Genius)
    rate_limit_store: общий rate-limit-store на Postgres (две реплики six-feat, общий бюджет)
    artist_endpoint: тесты /api/v1/artist (metadata + fetch_state, L1/L2)
    openapi_endpoint: тесты /api/v1/openapi.json (статический OpenAPI 3.1)
    game_profile: тесты /api/v1/game/profile (требуется docker-compose стек)
    game_validate: тесты /api/v1/game/validate (серверная анти-чит проверка; требуется стек)
    game_submit: тесты /api/v1/game/submit (скор + Elo против идеала челленджа; требуется стек)
    game_challenge: тесты /api/v1/game/challenge и daily-challenge фоновой задачи (требуется стек)
    game_leaderboard: тесты /api/v1/game/leaderboard, rate-limit сабмита, public profile (требуется стек)
    game_fuzz: adversarial/fuzz покрытие /api/v1/game/validate и /submit (требуется стек)
    game_link: тесты /api/v1/game/link (проверка связи по хопам; требуется стек)
    game_challenges: тесты /api/v1/game/challenges (браузер челленджей; требуется стек)
    game_season: тесты /api/v1/game/season (сезон и достижения; требуется стек)
    game_admin: тесты /api/v1/game/admin (owner-гейт статус-проб и daily publish; требуется стек)
    backup_restore: тесты scripts/backup-postgres.sh и restore-postgres.sh (нужны Postgres и postgresql-client)

addopts =
    --tb=short
    -v
    --strict-markers
