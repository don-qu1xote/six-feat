[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini  —  six-feat integration test configuration
# ─────────────────────────────────────────────────────────────────────────────

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers (used to filter test groups in CI)
markers =
    status_endpoint: tests for /api/v1/status (implemented; marker kept for back-compat filtering, no longer excluded in CI)
    health_endpoint: tests for /healthz (implemented; marker kept for back-compat filtering, no longer excluded in CI)
    integration: requires a running service binary
    unit: pure-Python unit tests, no binary required
    sse_endpoint: tests for /api/v1/status/stream SSE (implemented; long-running stream tests)
    static_headers: tests for security response headers on the static file handler (/, /script.js)
    bg_profile: tests using the second service_proc_bg instance (BG-enrichment, circuit breaker, retry/backoff — see tests/test_bg_resilience.py)
    image_proxy_endpoint: tests for /api/v1/image (SF-API-12 same-origin Genius CDN image proxy)
    rate_limit_store: tests for the shared/Postgres-backed rate-limit-store backend (SF-SEC-04, two six-feat replicas sharing one budget)
    artist_endpoint: tests for /api/v1/artist (SF-API-03 artist metadata + fetch_state, L1/L2 only)
    openapi_endpoint: tests for /api/v1/openapi.json (SF-API-05 static OpenAPI 3.1 document)
    game_profile: tests for /api/v1/game/profile (SF-GAME-12 player profile over the Genius session; needs the docker-compose stack)
    game_validate: tests for /api/v1/game/validate (SF-GAME-14 server-side anti-cheat chain check; needs the docker-compose stack)
    game_submit: tests for /api/v1/game/submit (SF-GAME-15 scoring + Elo update against a challenge's ideal; needs the docker-compose stack)
    game_challenge: tests for /api/v1/game/challenge and the daily-challenge background task (SF-GAME-16; needs the docker-compose stack)
    game_leaderboard: tests for /api/v1/game/leaderboard, submit rate-limiting, and public /api/v1/game/profile?user= lookups (SF-GAME-17; needs the docker-compose stack)
    game_fuzz: adversarial/fuzz coverage for /api/v1/game/validate and /api/v1/game/submit (SF-GAME-20; needs the docker-compose stack)
    game_link: tests for /api/v1/game/link (game #2 live per-hop connection check; needs the docker-compose stack)
    game_challenges: tests for /api/v1/game/challenges (game #3 challenge-browser listing; needs the docker-compose stack)
    game_season: tests for /api/v1/game/season (game #4 season & achievements hub; needs the docker-compose stack)
    game_admin: tests for /api/v1/game/admin (owner-gated status probe + on-demand daily publish; needs the docker-compose stack)

# Output options
addopts =
    --tb=short
    -v
    --strict-markers

# Timeout: individual tests must not hang indefinitely
# Requires pytest-timeout: pip install pytest-timeout
# timeout = 30

# Asyncio mode (if pytest-asyncio is installed)
# asyncio_mode = auto
