type: object
description: >-
    [SF-API-15] Postgres-backed store for api_keys (issue/resolve/revoke) —
    the table is bootstrapped idempotently by PersistentStore
    (six-feat-storage, see postgresql/schema.sql), same split already used
    for rate_buckets/RateLimitStoreComponent: this component gets its own
    cluster handle and trusts the table already exists.
additionalProperties: false
properties:
    dbname:
        type: string
        description: Name of the components::Postgres component whose cluster backs this store
        defaultDescription: postgres-db-1
