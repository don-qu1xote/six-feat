type: object
description: >-
    [SF-SEC-01] Periodically verifies that six_feat and six-feat-auth were
    started with the same APP_SECRET, by comparing non-invertible key
    fingerprints over the internal HTTP mesh — never the secret itself.
additionalProperties: false
properties:
    auth-base-url:
        type: string
        description: Base URL of the six-feat-auth service, e.g. http://six-feat-auth:8083
    timeout-ms:
        type: integer
        description: Per-request timeout for the fingerprint check call
        defaultDescription: '3000'
    check-interval-ms:
        type: integer
        description: How often to re-check APP_SECRET parity with six-feat-auth
        defaultDescription: '30000'
