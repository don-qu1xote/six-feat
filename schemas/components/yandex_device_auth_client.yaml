type: object
description: OAuth Device Authorization Grant client for a personal Yandex Music account — the settings/playlists fallback grant for sessions whose own login token lacks music:api-public (see YANDEX_OAUTH_SCOPE).
additionalProperties: false
properties:
    device-code-url:
        type: string
        description: Device code request endpoint
        defaultDescription: https://oauth.yandex.ru/device/code
    token-url:
        type: string
        description: Token exchange/poll endpoint
        defaultDescription: https://oauth.yandex.ru/token
    client-id:
        type: string
        description: OAuth client-id registered on oauth.yandex.ru (not a secret)
        defaultDescription: ''
    scope:
        type: string
        description: >-
            Пробел-разделённый список прав для device-flow — как и у
            yandex-oauth-config.scope, должен совпадать с тем, что реально
            выдано этому client-id в кабинете, иначе весь запрос отклоняется
            (invalid_scope). Пусто — Яндекс выдаёт права по умолчанию.
        defaultDescription: "music:api-public"
    backoff-max-attempts:
        type: integer
        description: Maximum retry attempts for transient failures
        defaultDescription: '4'
    backoff-base-ms:
        type: integer
        description: Initial backoff interval in milliseconds
        defaultDescription: '200'
    backoff-cap-ms:
        type: integer
        description: Maximum backoff interval in milliseconds
        defaultDescription: '10000'
    lane-fg-tokens-per-sec:
        type: number
        description: Rate limit for foreground requests in tokens per second
        defaultDescription: '2.0'
    lane-fg-burst:
        type: integer
        description: Token bucket burst size for foreground lane
        defaultDescription: '2'
    lane-fg-max-concurrent:
        type: integer
        description: Maximum concurrent foreground requests
        defaultDescription: '2'
    lane-bg-tokens-per-sec:
        type: number
        description: Rate limit for background requests in tokens per second
        defaultDescription: '1.0'
    lane-bg-burst:
        type: integer
        description: Token bucket burst size for background lane
        defaultDescription: '1'
    lane-bg-max-concurrent:
        type: integer
        description: Maximum concurrent background requests
        defaultDescription: '1'
    cb-failure-threshold:
        type: integer
        description: Number of failures before circuit opens
        defaultDescription: '5'
    cb-open-seconds:
        type: integer
        description: Duration to keep circuit open in seconds
        defaultDescription: '30'
