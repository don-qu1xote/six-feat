type: object
description: >-
    [SF-GAME-13] Anti-cheat client: verifies a claimed hop A→B via six-feat's
    internal /internal/neighbours endpoint.
additionalProperties: false
properties:
    six-feat-base-url:
        type: string
        description: Base URL of the six-feat service, e.g. http://six-feat:8080
    timeout-ms:
        type: integer
        description: Per-request timeout for calls to six-feat's /internal/neighbours
        defaultDescription: '2000'
