type: object
description: Configurable MusicSourceProvider composition — currently a single Genius provider, kept as a component list rather than a hardcoded reference
additionalProperties: false
properties:
    providers:
        type: array
        description: Ordered provider names, tried in sequence until one succeeds
        defaultDescription: '[genius-fallback]'
        items:
            type: string
            description: Provider component name (genius-fallback)
