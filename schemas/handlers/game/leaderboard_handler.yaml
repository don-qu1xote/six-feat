type: object
description: >-
    GET /api/v1/game/leaderboard — top-N by challenge or season, one entry
    per player. [SF-PERF-06] Page 1 of each distinct (scope, id, limit) is
    cached in-process for cache-ttl-ms.
additionalProperties: false
properties:
    cache-ttl-ms:
        type: integer
        description: How long a cached page-1 leaderboard response stays fresh
        defaultDescription: '15000'
