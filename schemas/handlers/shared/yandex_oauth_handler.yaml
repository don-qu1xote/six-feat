type: object
description: >-
    Yandex OAuth 2.0 (authorization code flow) — a session login provider
    parallel to Genius, not layered on top of it. Distinct from the device
    flow, which connects a personal token to an already logged-in user for
    playlist import and never creates a session.

    Session parameters (TTL, cookie flags, encryption key) are deliberately
    NOT duplicated here: they are read from oauth-config so that a session is
    issued identically no matter which provider the user logged in with.
additionalProperties: false
properties:
    client-id:
        type: string
        description: >-
            Yandex OAuth application client_id (https://oauth.yandex.ru/client/new).
            Separate from the Genius client and from the device-flow client.
            Empty disables Yandex login; Genius login stays available.
    redirect-uri:
        type: string
        description: >-
            OAuth callback URL. Must exactly match the Redirect URI registered
            for this client_id in the Yandex OAuth console.
    oauth-base-url:
        type: string
        description: Yandex OAuth base URL (/authorize, /token)
        defaultDescription: https://oauth.yandex.ru
    login-base-url:
        type: string
        description: >-
            Yandex passport base URL serving /info, which returns the immutable
            `id` used as the user identity (see auth::SessionUserId). Split from
            oauth-base-url because these are different hosts in production and
            both need overriding independently in tests.
        defaultDescription: https://login.yandex.ru
