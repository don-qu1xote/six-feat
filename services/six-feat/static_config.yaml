# ════════════════════════════════════════════════════════════════════════════
# static_config.yaml  —  iteration 8 (IDEA-26: background enrichment moved to
# the standalone six-feat-enrichment service — see services/enrichment/)
#
# Two task processors:
#   main-task-processor  — foreground requests (handlers run here)
#   fs-task-processor    — Postgres driver blocking ops + DNS + logging I/O
# ════════════════════════════════════════════════════════════════════════════

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 8
      thread_name: main-worker

    fs-task-processor:
      worker_threads: 4
      thread_name: fs-task-processor

    # [IDEA-27] Dedicated, low-concurrency TP for the internal metrics
    # endpoint so scraping never contends with foreground request handling.
    monitor-task-processor:
      worker_threads: 1
      thread_name: monitor-worker

  default_task_processor: main-task-processor

  components:
    # ── Userver built-ins ───────────────────────────────────────────────────
    server:
      listener:
        port: 8080
        task_processor: main-task-processor
      # [IDEA-27] Internal-only listener for handler-server-monitor below —
      # separate port, no public exposure (not mapped in docker-compose.yml),
      # no auth-checker configured since network isolation is the boundary.
      listener-monitor:
        port: 8085
        task_processor: monitor-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    http-client:

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stdout'
          level: $logging_level
              #fallback: info

    testsuite-support:

    # ── Postgres cluster (backs persistent-store below) ─────────────────────
    # sync-start: false — a synchronous start makes components::Run throw and
    # exit the whole process if the pool can't connect within its window
    # (crash-loop, relying on Docker's blind container restart to eventually
    # land after Postgres catches up — not a real fix). With this off, the
    # component starts immediately and keeps retrying the connection in the
    # background; readiness_handler.cpp already pings the DB and reports 503
    # "not_ready" on /readyz until the pool is actually up, so the container
    # correctly stays un-healthy (and out of nginx's rotation) instead of the
    # process dying outright. See docker-entrypoint.sh's pg_isready wait for
    # the complementary first-line defense.
    postgres-db-1:
      dbconnection: $db_connection_string
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: false
      connlimit_mode: manual
      min_pool_size: 4
      max_pool_size: 15
      max_queue_size: 200

    # ── L1 persistent store ─────────────────────────────────────────────────
    persistent-store:
      dbname: postgres-db-1

    # ── Network layer ───────────────────────────────────────────────────────
    # [ТЗ-6] No server-level Genius token anymore — every Genius API call is
    # made with the requesting user's own OAuth session token (see
    # oauth-config below). Anonymous requests are rejected by the handlers.
    # [IDEA-46] Genius API access itself (incl. CircuitBreaker and FG/BG lane
    # rate-limiting) has moved to the standalone six-feat-genius-gateway
    # service — this component is now just a secret-gated HTTP client to it.
    genius-gateway-client:
      genius-gateway-base-url: $genius_gateway_base_url
      timeout-ms: 5000
      songs-limit-fg: 40       # raised from 10 — improves FG graph coverage
      songs-limit-bg: 80
      match-threshold: 0.75

    # ── OAuth 2.0 (Genius) — session validation only ─────────────────────────
    # [IDEA-53] The OAuth flow itself (/auth/login|callback|logout|me) now
    # lives in the standalone six-feat-auth service (see services/auth/). This
    # component stays here ONLY so RequireSession/ExtractToken
    # (src/auth/token_router.hpp) can decrypt the six_feat_session cookie
    # LOCALLY, with no HTTP call to six-feat-auth on every request — that's
    # what keeps per-request auth latency-free. client_id/redirect_uri below
    # are unused by this service (kept only because OAuthConfig's
    # constructor validates them) — they must still be set to the same
    # values as six-feat-auth's, and client_secret still comes from the same
    # GENIUS_CLIENT_SECRET env var (both services share it), APP_SECRET too.
    oauth-config:
      client-id: $genius_client_id
      redirect-uri: $genius_redirect_uri
      genius-base-url: https://api.genius.com
      session-ttl-days: 90
      # cookie-secure: false в dev (HTTP localhost), true в prod (HTTPS)
      cookie-secure: $cookie_secure
      # [F-38] PKCE (RFC 7636) — код готов, но выключен по умолчанию: Genius
      # не документирует code_challenge/code_verifier, включать без
      # подтверждённой поддержки со стороны Genius рискованно (может сломать
      # логин всем пользователям).
      pkce-enabled: false

    # ── L1 read-through repository (Postgres buffer cache + replica) ──────
    artist-repository: {}

    # ── Background enrichment (IDEA-26: HTTP client to six-feat-enrichment) ──
    enrichment-client:
      enrichment-base-url: $enrichment_base_url
      timeout-ms: 3000
      # [IDEA-43] In-memory retry queue for jobs that failed to reach
      # six-feat-enrichment (network error / non-2xx) — best-effort, backed
      # by durable RecoverPendingArtists() on the enrichment side.
      retry-queue-capacity: 256
      retry-interval-ms: 15000
      max-retry-age-seconds: 900
      # [IDEA-49] Short shared TTL so every open SSE stream / status-handler
      # call for the same artist_id reuses one HTTP round trip instead of
      # polling six-feat-enrichment on every ~2s tick.
      enriching-cache-ttl-ms: 3000

    # ── Orchestration layer ─────────────────────────────────────────────────
    collab-service:
      path-max-expand-rounds: 3
      path-max-frontier-size: 6   # cap BFS frontier per round to limit Genius RPS

    # ── HTTP handlers ───────────────────────────────────────────────────────
    handler-graph:
      path: /api/v1/graph
      method: GET
      task_processor: main-task-processor
      # [IDEA-22] Upper bound for the optional ?limit= override (per-request
      # songs-limit-fg override) — caps how much Genius quota a single
      # "show more collaborations" request can spend.
      max-limit-override: 50

    handler-path:
      path: /api/v1/graph/path
      method: GET
      task_processor: main-task-processor

    # [F-10] Lightweight autocomplete: candidate resolve only, no graph build,
    # no BG enrichment enqueue.
    handler-search:
      path: /api/v1/search
      method: GET
      task_processor: main-task-processor

    # ── OAuth handlers ──────────────────────────────────────────────────────
    # [IDEA-53] Moved to the standalone six-feat-auth service — see
    # services/auth/static_config.yaml. External routing must send /auth/*
    # to six-feat-auth instead of this service (see docker-compose.yml).

    handler-index:
      path: /
      method: GET
      task_processor: main-task-processor
      file-path: /usr/share/six_feat/index.html
      content-type: text/html; charset=utf-8
      # Always revalidated so a plain refresh (no hard-refresh needed) picks
      # up index.html's new reference to the current hashed script URL.
      cache-control: 'no-cache'
      # Rewritten by the Docker build (see Dockerfile) to the actual
      # content-hashed bundle name, e.g. /script.a1b2c3d4.js — every
      # "/script.js" occurrence inside index.html is replaced with this
      # value at handler startup (see static_handler.cpp TransformContent).
      script-url: $script_url

    handler-script:
      # Path is templated by the Docker build to match the hashed file name
      # actually shipped in the image (see Dockerfile / docker-entrypoint
      # substitution), so this route and handler-index's injected reference
      # always agree.
      path: $script_path
      method: GET
      task_processor: main-task-processor
      file-path: $script_file_path
      content-type: application/javascript; charset=utf-8
      # Content-addressed filename → safe to cache "forever": if the
      # content ever changes, the filename (and therefore the URL) changes
      # with it.
      cache-control: 'public, max-age=31536000, immutable'
    handler-healthz:
      path: /healthz
      method: GET
      task_processor: main-task-processor

    handler-readyz:
      path: /readyz
      method: GET
      task_processor: main-task-processor

    handler-status:
      path: /api/v1/status
      method: GET
      task_processor: main-task-processor

    handler-status-stream:
      path: /api/v1/status/stream
      method: GET
      task_processor: main-task-processor
      response-body-stream: true

    # ── Observability (IDEA-27) ─────────────────────────────────────────────
    # [IDEA-46] CB state / FG/BG lane token+slot metrics now live on
    # six-feat-genius-gateway's own /metrics — nothing genius-specific to
    # report here anymore. Never the public port/listener.
    handler-server-monitor:
      path: /metrics
      method: GET
      task_processor: monitor-task-processor