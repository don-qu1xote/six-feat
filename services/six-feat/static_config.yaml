

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 8
      thread_name: main-worker

    fs-task-processor:
      worker_threads: 4
      thread_name: fs-task-processor

    monitor-task-processor:
      worker_threads: 1
      thread_name: monitor-worker

  default_task_processor: main-task-processor

  components:

    server:
      listener:
        port: 8080
        task_processor: &main_tp main-task-processor

      listener-monitor:
        port: 8085
        task_processor: &monitor_tp monitor-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    http-client:

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stdout'
          level: $logging_level

          format: json

    testsuite-support:

    postgres-db-1:
      dbconnection: $db_connection_string
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: false
      connlimit_mode: manual
      min_pool_size: 4
      max_pool_size: 15
      max_queue_size: 200

    persistent-store:
      dbname: postgres-db-1

    rate-limit-store:
      backend: single
      dbname: postgres-db-1

    api-key-store:
      dbname: postgres-db-1

    idempotency-store:
      dbname: postgres-db-1

    genius-gateway-client:
      genius-gateway-base-url: $genius_gateway_base_url
      timeout-ms: 5000
      songs-limit-fg: 40
      songs-limit-bg: 80
      match-threshold: 0.75

    yandex-gateway-client:
      yandex-gateway-base-url: $yandex_gateway_base_url
      timeout-ms: 5000
      tracks-limit: 20

    yandex-music-source-provider:
      match-threshold: 0.75

    genius-music-source-provider: {}

    music-source-provider-chain:
      providers: [yandex, genius-fallback]

    oauth-config:
      client-id: $genius_client_id
      redirect-uri: $genius_redirect_uri
      genius-base-url: https://api.genius.com
      session-ttl-days: 90

      cookie-secure: $cookie_secure

      pkce-enabled: false

    app-secret-parity-checker:
      auth-base-url: $auth_base_url
      timeout-ms: 3000
      check-interval-ms: 30000

    artist-repository: {}

    enrichment-client:
      enrichment-base-url: $enrichment_base_url
      timeout-ms: 3000

      retry-queue-capacity: 256
      retry-interval-ms: 15000
      max-retry-age-seconds: 900

      enriching-cache-ttl-ms: 3000

    collab-service:
      path-max-expand-rounds: 3
      path-max-frontier-size: 6

    handler-graph:
      path: /api/v1/graph
      method: GET
      task_processor: *main_tp

      max-limit-override: 50

    handler-path:
      path: /api/v1/graph/path
      method: GET
      task_processor: *main_tp

    handler-search:
      path: /api/v1/search
      method: GET
      task_processor: *main_tp

    handler-index:
      path: /
      method: GET
      task_processor: *main_tp
      file-path: /usr/share/six_feat/index.html
      content-type: text/html; charset=utf-8

      cache-control: 'no-cache'

      script-url: $script_url

      style-url: $style_url

    handler-script:

      path: $script_path
      method: GET
      task_processor: *main_tp
      file-path: $script_file_path
      content-type: application/javascript; charset=utf-8

      cache-control: 'public, max-age=31536000, immutable'

    handler-style:
      path: $style_path
      method: GET
      task_processor: *main_tp
      file-path: $style_file_path
      content-type: text/css; charset=utf-8
      cache-control: 'public, max-age=31536000, immutable'

    handler-vendor-vis-network:
      path: /vendor/vis-network.min.js
      method: GET
      task_processor: *main_tp
      file-path: /usr/share/six_feat/vendor/vis-network.min.js
      content-type: application/javascript; charset=utf-8
      cache-control: 'public, max-age=31536000, immutable'

    handler-openapi:
      path: /api/v1/openapi.json
      method: GET
      task_processor: *main_tp
      file-path: /usr/share/six_feat/openapi.json
      content-type: application/json; charset=utf-8
      cache-control: 'public, max-age=3600, must-revalidate'

    handler-healthz:
      path: /healthz
      method: GET
      task_processor: *main_tp

    handler-readyz:
      path: /readyz
      method: GET
      task_processor: *main_tp

    handler-status:
      path: /api/v1/status
      method: GET
      task_processor: *main_tp

    handler-artist:
      path: /api/v1/artist
      method: GET
      task_processor: *main_tp

    handler-api-keys-issue:
      path: /api/v1/api-keys
      method: POST
      task_processor: *main_tp

    handler-api-keys-revoke:
      path: /api/v1/api-keys/revoke
      method: POST
      task_processor: *main_tp

    handler-internal-neighbours:
      path: /internal/neighbours
      method: POST
      task_processor: *main_tp

    handler-internal-music-source-edges:
      path: /internal/music-source/collaboration-edges
      method: POST
      task_processor: *main_tp

    handler-status-stream:
      path: /api/v1/status/stream
      method: GET
      task_processor: *main_tp
      response-body-stream: true

    handler-image:
      path: /api/v1/image
      method: GET
      task_processor: *main_tp
      timeout-ms: 5000

    handler-server-monitor:
      path: /metrics
      method: GET
      task_processor: *monitor_tp