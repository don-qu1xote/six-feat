

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
      thread_name: main-worker

    fs-task-processor:
      worker_threads: 4
      thread_name: fs-task-processor

    monitor-task-processor:
      worker_threads: 1
      thread_name: monitor-worker

  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8083
        task_processor: &main_tp main-task-processor

      listener-monitor:
        port: 8088
        task_processor: &monitor_tp monitor-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    http-client:

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stdout'
          level: $logging_level

          format: json

    testsuite-support:

    oauth-config:
      client-id: $genius_client_id
      redirect-uri: $genius_redirect_uri
      genius-base-url: https://api.genius.com
      session-ttl-days: 90

      cookie-secure: $cookie_secure

      pkce-enabled: false

    handler-auth-login:
      path: /auth/login
      method: GET
      task_processor: *main_tp

    handler-auth-callback:
      path: /auth/callback
      method: GET
      task_processor: *main_tp

    handler-auth-logout:
      path: /auth/logout

      method: POST
      task_processor: *main_tp

    handler-auth-me:
      path: /auth/me
      method: GET
      task_processor: *main_tp

    handler-healthz:
      path: /healthz
      method: GET
      task_processor: *main_tp

    handler-readyz:
      path: /readyz
      method: GET
      task_processor: *main_tp

    handler-internal-key-fingerprint:
      path: /internal/key-fingerprint
      method: GET
      task_processor: *main_tp

    handler-server-monitor:
      path: /metrics
      method: GET
      task_processor: *monitor_tp
