# six-feat-game — competitive "connect two artists" game service (SF-GAME-10
# skeleton). Boots, answers /healthz and /readyz, exposes the internal metrics
# listener. No Postgres component and no game handlers yet — the game_* store
# lands in SF-GAME-11 (it will read $db_connection_string, already assembled by
# docker-entrypoint.sh), the session-based profile in SF-GAME-12, the
# challenge/submit/leaderboard endpoints across sprint 13.
#
# Structure mirrors services/auth/static_config.yaml (the closest sibling): the
# same task-processor layout with YAML anchors (*main_tp/*monitor_tp, SF-SCH-02),
# the same dedicated low-concurrency monitor TP, the same JSON logging block
# kept identical across all services (SF-OBS-03).

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
      thread_name: main-worker

    fs-task-processor:
      worker_threads: 4
      thread_name: fs-task-processor

    # [IDEA-27 pattern] Dedicated, low-concurrency TP for the internal
    # metrics endpoint so scraping never contends with request handling.
    monitor-task-processor:
      worker_threads: 1
      thread_name: monitor-worker

  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8084
        task_processor: &main_tp main-task-processor
      # Internal-only listener for handler-server-monitor below — separate
      # port, no host port mapping in docker-compose.yml, no auth-checker
      # of its own.
      listener-monitor:
        port: 8089
        task_processor: &monitor_tp monitor-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    http-client:

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stdout'
          level: $logging_level
          # [SF-OBS-03] Structured JSON — kept identical across all services'
          # static_config.yaml (see services/six-feat/static_config.yaml for
          # the full rationale).
          format: json

    testsuite-support:

    # ── Postgres cluster (backs game-store below) ───────────────────────────
    # [SF-GAME-11] Same shared cluster/config as six-feat's postgres-db-1 (see
    # services/six-feat/static_config.yaml for the full rationale on each key).
    # sync-start: false so an unreachable Postgres at boot doesn't crash the
    # process — handler-readyz reports 503 until the pool is up (see
    # internal_handlers.cpp's "database" check). $db_connection_string is
    # assembled by docker-entrypoint.sh.
    postgres-db-1:
      dbconnection: $db_connection_string
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: false
      connlimit_mode: manual
      min_pool_size: 4
      max_pool_size: 15
      max_queue_size: 200

    # ── Game store (owns the game_* migration registry) ─────────────────────
    game-store:
      dbname: postgres-db-1

    # [SF-GAME-13] Anti-cheat client — verifies a claimed hop A→B against
    # six-feat's internal /internal/neighbours instead of six-feat-game ever
    # talking to Genius itself. Shares ENRICHMENT_INTERNAL_SECRET as the
    # internal-mesh secret, same convention genius-gateway's own internal API
    # already established (see core/internal_auth.hpp's module comment).
    neighbours-client:
      six-feat-base-url: $six_feat_base_url
      timeout-ms: 2000

    # [SF-GAME-16] Once-a-day publisher for kind="daily" challenges — see
    # daily_challenge_task.hpp. Always on (no env-var toggle, unlike
    # PruneTask): cheap, idempotent, no operational reason to disable it.
    daily-challenge-task:
      interval-seconds: 86400
      min-path-len: 2
      max-attempts: 20
      candidate-pool-size: 50

    # ── Handlers ────────────────────────────────────────────────────────────
    handler-healthz:
      path: /healthz
      method: GET
      task_processor: *main_tp

    # [SF-INF-03] Unified readiness contract — see
    # libs/six-feat-common/src/http/readiness_common.hpp. [SF-GAME-11] checks{}
    # now carries the "database" ping (game-store's Postgres cluster).
    handler-readyz:
      path: /readyz
      method: GET
      task_processor: *main_tp

    # [SF-GAME-12] Player profile — GET reads/creates the caller's profile,
    # PATCH renames it. One handler, both methods (branched on GetMethod).
    # nginx proxies /api/v1/game/* here, so the public path is the same.
    handler-game-profile:
      path: /api/v1/game/profile
      method: GET, PATCH
      task_processor: *main_tp

    # [SF-GAME-14] Server-side anti-cheat: verifies every hop of a submitted
    # chain against six-feat's /internal/neighbours (see chain_validator.hpp,
    # neighbours-client above). nginx proxies /api/v1/game/* here, so the
    # public path is the same.
    handler-game-validate:
      path: /api/v1/game/validate
      method: POST
      task_processor: *main_tp

    # [SF-GAME-15] Scores a confirmed-valid attempt against the challenge's
    # own BFS ideal (game_challenges.optimal_len/optimal_path) and updates
    # the player's Elo — see scoring.hpp, game_store.hpp's RecordValidAttempt.
    # nginx proxies /api/v1/game/* here, so the public path is the same.
    handler-game-submit:
      path: /api/v1/game/submit
      method: POST
      task_processor: *main_tp

    # [SF-GAME-16] Challenge create/get — POST creates (or returns the
    # existing) challenge and lazily computes+caches its ideal
    # (ideal_finder.hpp); GET reads one by id, minus optimal_path (see
    # challenge_handler.hpp for why GET uses ?id= instead of a path
    # parameter). nginx proxies /api/v1/game/* here, so the public path is
    # the same.
    handler-game-challenge:
      path: /api/v1/game/challenge
      method: GET, POST
      task_processor: *main_tp

    # ── Observability (IDEA-27 pattern) ─────────────────────────────────────
    handler-server-monitor:
      path: /metrics
      method: GET
      task_processor: *monitor_tp
