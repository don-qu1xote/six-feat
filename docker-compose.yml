x-hardening: &hardening

  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"

services:

  postgres:
    image: postgres:16-alpine
    container_name: six-feat-postgres
    environment:

      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

      DB_REPLICATOR_USER: ${DB_REPLICATOR_USER:-replicator}
      DB_REPLICATOR_PASSWORD: ${DB_REPLICATOR_PASSWORD:-replicator_dev_password}
    volumes:
      - ./.pgdata:/var/lib/postgresql/data

      - ./postgresql/prod-like/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  postgres-replica:
    image: postgres:16-alpine
    container_name: six-feat-postgres-replica
    profiles: ["prod-like"]
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
      DB_REPLICATOR_USER: ${DB_REPLICATOR_USER:-replicator}
      DB_REPLICATOR_PASSWORD: ${DB_REPLICATOR_PASSWORD:-replicator_dev_password}
    volumes:
      - ./.pgdata-replica:/var/lib/postgresql/data
      - ./postgresql/prod-like/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/replica-entrypoint.sh"]
    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # [SF-INF-08] backup — только через --profile backup, как postgres-replica.
  postgres-backup:
    image: postgres:16-alpine
    container_name: six-feat-postgres-backup
    profiles: ["backup"]
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ${BACKUP_HOST_DIR:-./.backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export -p > /tmp/backup.env
        mkdir -p /tmp/crontabs
        echo "$$BACKUP_SCHEDULE . /tmp/backup.env; /usr/local/bin/backup-postgres.sh" \
          > /tmp/crontabs/root
        echo "[backup] scheduled: $$BACKUP_SCHEDULE (keep $$BACKUP_KEEP)"
        exec crond -f -d 8 -c /tmp/crontabs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  six-feat:
    platform: linux/amd64
    pull_policy: build
    build:
      context: .
      dockerfile: services/six-feat/Dockerfile

      args:
        USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0
    image: six-feat:latest
    container_name: six-feat

    expose:
      - "${SIX_FEAT_PORT:-8080}"
    # [SF-CFG-01] Read-only bind-mount profiles — ENV_PROFILE-выбранный
    # файл sourced docker-entrypoint.sh при старте.
    volumes:
      - ./config/profiles:/app/config/profiles:ro
    environment:
      # Из shell-окружения или .env (см. .env.example)
      # [ТЗ-6] Серверный токен Genius больше не нужен — auth только OAuth.
      GENIUS_CLIENT_ID: ${GENIUS_CLIENT_ID:?Set GENIUS_CLIENT_ID — from https://genius.com/api-clients}
      GENIUS_CLIENT_SECRET: ${GENIUS_CLIENT_SECRET:?Set GENIUS_CLIENT_SECRET — keep it secret}
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET — generate with: openssl rand -hex 32}"

      GENIUS_REDIRECT_URI: ${GENIUS_REDIRECT_URI:-http://localhost:8080/auth/callback}
      # [SF-CFG-01] Пусто (не захардкоженный дефолт) — чтобы не заданное
      # значение из .env/shell падало в config/profiles/${ENV_PROFILE}.env.
      # Явное COOKIE_SECURE/LOGGING_LEVEL в .env по-прежнему перекрывает
      # профиль (docker-entrypoint.sh source-ит профиль через ${VAR:-default}).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      # [SF-CFG-01] Выбирает config/profiles/${ENV_PROFILE().env, sourced
      # docker-entrypoint.sh — см. docs/DEVELOPMENT.md «Env-профили».
      # Единственное различие между dev/staging/prod для этого compose.yml.
      ENV_PROFILE: ${ENV_PROFILE:-dev}

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_REPLICA_HOST: ${DB_REPLICA_HOST:-}
      DB_REPLICA_PORT: ${DB_REPLICA_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

      ENRICHMENT_BASE_URL: ${ENRICHMENT_BASE_URL:-http://six-feat-enrichment:${SIX_FEAT_ENRICHMENT_PORT:-8081}}
      ENRICHMENT_INTERNAL_SECRET: "${ENRICHMENT_INTERNAL_SECRET:?Set ENRICHMENT_INTERNAL_SECRET — generate with: openssl rand -hex 32}"

      GENIUS_GATEWAY_BASE_URL: ${GENIUS_GATEWAY_BASE_URL:-http://six-feat-genius-gateway:${SIX_FEAT_GENIUS_GATEWAY_PORT:-8082}}

      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://six-feat-auth:${SIX_FEAT_AUTH_PORT:-8083}}
    depends_on:
      postgres:
        condition: service_healthy
      six-feat-enrichment:
        condition: service_started

      six-feat-genius-gateway:
        condition: service_started

      six-feat-auth:
        condition: service_started
    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:${SIX_FEAT_PORT:-8080}/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

      start_period: 120s
    restart: unless-stopped

    <<: *hardening

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  six-feat-enrichment:
    platform: linux/amd64
    pull_policy: build
    build:
      context: .
      dockerfile: services/six-feat-enrichment/Dockerfile
      args:
        USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0
    image: six-feat-enrichment:latest
    container_name: six-feat-enrichment
    # [SF-CFG-01] См. комментарий к six-feat volumes выше.
    volumes:
      - ./config/profiles:/app/config/profiles:ro
    environment:
      ENRICHMENT_INTERNAL_SECRET: "${ENRICHMENT_INTERNAL_SECRET:?Set ENRICHMENT_INTERNAL_SECRET — generate with: openssl rand -hex 32}"

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_REPLICA_HOST: ${DB_REPLICA_HOST:-}
      DB_REPLICA_PORT: ${DB_REPLICA_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      # [SF-CFG-01] Пусто — см. комментарий к six-feat LOGGING_LEVEL выше;
      # config/profiles/${ENV_PROFILE}.env теперь владеет этим дефолтом.
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      ENV_PROFILE: ${ENV_PROFILE:-dev}

      GENIUS_GATEWAY_BASE_URL: ${GENIUS_GATEWAY_BASE_URL:-http://six-feat-genius-gateway:${SIX_FEAT_GENIUS_GATEWAY_PORT:-8082}}
    depends_on:
      postgres:
        condition: service_healthy

      six-feat-genius-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SIX_FEAT_ENRICHMENT_PORT:-8081}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

      start_period: 120s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: six-feat-nginx
    ports:
      - "${NGINX_PUBLIC_PORT:-8080}:${NGINX_PUBLIC_PORT:-8080}"
    environment:

      NGINX_PUBLIC_PORT: ${NGINX_PUBLIC_PORT:-8080}
      SIX_FEAT_PORT: ${SIX_FEAT_PORT:-8080}
      SIX_FEAT_AUTH_PORT: ${SIX_FEAT_AUTH_PORT:-8083}

      SIX_FEAT_GAME_PORT: ${SIX_FEAT_GAME_PORT:-8084}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

    depends_on:
      six-feat:
        condition: service_healthy
      six-feat-auth:
        condition: service_healthy

      six-feat-game:
        condition: service_healthy
    restart: unless-stopped

  six-feat-auth:
    platform: linux/amd64
    pull_policy: build
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      args:
        USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0
    image: six-feat-auth:latest
    container_name: six-feat-auth

    ports:
      - "${SIX_FEAT_AUTH_PORT:-8083}:${SIX_FEAT_AUTH_PORT:-8083}"
    # [SF-CFG-01] См. комментарий к six-feat volumes выше.
    volumes:
      - ./config/profiles:/app/config/profiles:ro
    environment:

      GENIUS_CLIENT_ID: ${GENIUS_CLIENT_ID:?Set GENIUS_CLIENT_ID — from https://genius.com/api-clients}
      GENIUS_CLIENT_SECRET: ${GENIUS_CLIENT_SECRET:?Set GENIUS_CLIENT_SECRET — keep it secret}

      APP_SECRET: "${APP_SECRET:?Set APP_SECRET — generate with: openssl rand -hex 32}"
      GENIUS_REDIRECT_URI: ${GENIUS_REDIRECT_URI:-http://localhost:8080/auth/callback}
      # [SF-CFG-01] Пусто — см. комментарий к six-feat COOKIE_SECURE/
      # LOGGING_LEVEL выше; config/profiles/${ENV_PROFILE}.env теперь владеет.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      ENV_PROFILE: ${ENV_PROFILE:-dev}

      ENRICHMENT_INTERNAL_SECRET: "${ENRICHMENT_INTERNAL_SECRET:?Set ENRICHMENT_INTERNAL_SECRET — generate with: openssl rand -hex 32}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SIX_FEAT_AUTH_PORT:-8083}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

      start_period: 120s
    restart: unless-stopped
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  six-feat-genius-gateway:
    platform: linux/amd64
    pull_policy: build
    build:
      context: .
      dockerfile: services/genius-gateway/Dockerfile
      args:
        USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0
    image: six-feat-genius-gateway:latest
    container_name: six-feat-genius-gateway
    # [SF-CFG-01] См. комментарий к six-feat volumes выше.
    volumes:
      - ./config/profiles:/app/config/profiles:ro
    environment:
      ENRICHMENT_INTERNAL_SECRET: "${ENRICHMENT_INTERNAL_SECRET:?Set ENRICHMENT_INTERNAL_SECRET — generate with: openssl rand -hex 32}"
      # [SF-CFG-01] Пусто — см. комментарий к six-feat LOGGING_LEVEL выше;
      # config/profiles/${ENV_PROFILE}.env теперь владеет этим дефолтом.
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      ENV_PROFILE: ${ENV_PROFILE:-dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SIX_FEAT_GENIUS_GATEWAY_PORT:-8082}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  six-feat-game:
    platform: linux/amd64
    pull_policy: build
    build:
      context: .
      dockerfile: services/game/Dockerfile
      args:
        USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0
    image: six-feat-game:latest
    container_name: six-feat-game
    ports:
      - "${SIX_FEAT_GAME_PORT:-8084}:${SIX_FEAT_GAME_PORT:-8084}"
    # [SF-CFG-01] См. комментарий к six-feat volumes выше.
    volumes:
      - ./config/profiles:/app/config/profiles:ro
    environment:
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET — generate with: openssl rand -hex 32}"
      ENRICHMENT_INTERNAL_SECRET: "${ENRICHMENT_INTERNAL_SECRET:?Set ENRICHMENT_INTERNAL_SECRET — generate with: openssl rand -hex 32}"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_REPLICA_HOST: ${DB_REPLICA_HOST:-}
      DB_REPLICA_PORT: ${DB_REPLICA_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      # [SF-CFG-01] Пусто — см. комментарий к six-feat LOGGING_LEVEL выше;
      # config/profiles/${ENV_PROFILE}.env теперь владеет этим дефолтом.
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      ENV_PROFILE: ${ENV_PROFILE:-dev}

      SIX_FEAT_BASE_URL: ${SIX_FEAT_BASE_URL:-http://six-feat:${SIX_FEAT_PORT:-8080}}

      GAME_ADMIN_GENIUS_IDS: ${GAME_ADMIN_GENIUS_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy

      six-feat:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SIX_FEAT_GAME_PORT:-8084}/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

      start_period: 120s
    restart: unless-stopped
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: six-feat-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: six-feat-alertmanager
    profiles: ["observability"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: six-feat-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
