# Unifies six-feat (:8080) and six-feat-auth (:8083) under one public
# origin, so the front end's relative redirects/fetches (window.location.href
# = "/auth/login", GET /auth/me, POST /auth/logout — see front/src/api/net.js
# and front/src/api/auth.js) reach the right backend instead of 404ing on
# whichever service happens to be serving the page.
#
# GENIUS_REDIRECT_URI must point here (this proxy's public origin), not at
# six-feat-auth's own container port anymore — see docker-compose.yml.
server {
    listen 8080;

    location /auth/ {
        proxy_pass http://six-feat-auth:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://six-feat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
