name: Release supply chain

# SF-CI-03. Deliberately a separate workflow from ci.yml, not extra jobs in
# it: SBOM generation + keyless cosign signing only make sense once an image
# is actually being published, and both add real wall-clock time (a second
# full image build/push per service) that every PR shouldn't have to pay —
# so this only triggers on push to a long-lived branch or a version tag,
# never on pull_request. ci.yml's own docker-build-and-scan job still builds
# + Trivy-scans every PR; this workflow builds again (can't reuse that job's
# artifact — see the SBOM job's own comment) specifically to attest/sign
# what would actually ship.
#
# Two jobs, each one function — sbom (attest what's in the image) and
# publish (push + keylessly sign it) — deliberately NOT chained with
# `needs:` (see ci.yml's "Job graph" note for why that matters generally):
# a slow/flaky SBOM run must never block a real publish, and publish
# doesn't consume sbom's output, so serializing them would only add wait
# time for no correctness benefit. Each job's own build step is bundled
# with the thing it does with that build (generate SBOM / push+sign) rather
# than split further, because neither Docker image nor digest can be
# handed between jobs without a registry round-trip.
on:
  push:
    branches: [main, "melidadr"]
    tags: ["v*"]

# ── Single source of truth for the userver base image tag ───────────────────
# Duplicated from ci.yml (workflow files can't share top-level `env:` across
# files) — keep both in sync when bumping USERVER_IMAGE_TAG/DIGEST. See the
# matching comment in ci.yml for why the digest pin exists.
env:
  USERVER_IMAGE_REPO: ghcr.io/userver-framework/ubuntu-22.04-userver
  USERVER_IMAGE_TAG: v3.0
  USERVER_IMAGE_DIGEST: sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # SBOM (syft, via anchore/sbom-action) — one per service image, uploaded as
  # a build artifact. Builds locally (load: true, no push) rather than
  # reusing ci.yml's docker-build-and-scan matrix output: artifacts can't be
  # shared as live Docker images across jobs (let alone across workflow
  # files), and this workflow doesn't gate on that job anyway (different
  # trigger entirely — see the top-level comment).
  # ══════════════════════════════════════════════════════════════════════════
  sbom:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service.name }}:sbom
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Generate SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84  # v0.20.9
        with:
          image: ${{ matrix.service.name }}:sbom
          format: spdx-json
          output-file: ${{ matrix.service.name }}-sbom.spdx.json
          artifact-name: ${{ matrix.service.name }}-sbom.spdx.json
          upload-artifact-retention: 90

  # ══════════════════════════════════════════════════════════════════════════
  # Build, push to GHCR, and keylessly sign (cosign + GitHub OIDC — no
  # long-lived signing key stored anywhere) each service image. Runs
  # independently of the sbom job above (no `needs:`) so a slow/flaky SBOM
  # generation never blocks a real publish, matching e2e-smoke's own
  # independence rationale in ci.yml.
  # ══════════════════════════════════════════════════════════════════════════
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write   # docker push to ghcr.io
      id-token: write   # cosign keyless signing — Sigstore Fulcio/Rekor OIDC
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag ${{ github.sha }} always; also the git tag name itself (e.g.
      # "v1.2.3") on a tag push, and "latest" on a branch push — never both,
      # so "latest" only ever tracks the newest branch build, not a
      # possibly-older tagged release.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      # Keyless (OIDC) signing: cosign mints a short-lived cert from
      # Sigstore's public Fulcio CA using this job's ambient GitHub Actions
      # OIDC token (id-token: write above), signs the image DIGEST (not a
      # mutable tag — build-push-action's own digest output, immune to a
      # tag being repointed afterward), and records the signature in the
      # public Rekor transparency log. No signing key/passphrase is stored
      # in this repo at all — --yes just skips the interactive Fulcio
      # confirmation prompt, appropriate for a non-interactive CI run.
      - name: Sign image (cosign, keyless/OIDC)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"
