name: CI

on:
  push:
    branches: [main, "melidadr"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Прогнать ВСЕ джобы, не разбирая дифф (медленно, но полностью)"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  USERVER_IMAGE_TAG: v3.0
  USERVER_IMAGE_REPO: ghcr.io/userver-framework/ubuntu-22.04-userver
  USERVER_IMAGE_DIGEST: sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
  USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
  POSTGRES_IMAGE: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
  K6_VERSION: "0.55.0"
  # [SF-WEB-77] Same pins .githooks/pre-commit enforces locally (it checks
  # `clang-format --version`/`ruff --version` against these exact strings
  # before formatting) — so a commit that passes the local hook is
  # guaranteed to hit lint-format with byte-identical tool output, not just
  # "some version of the same tool".
  CLANG_FORMAT_VERSION: "18.1.8"
  RUFF_VERSION: "0.16.0"

jobs:
  verify-env-parity:
    name: "Config validation (env parity + profiles dev/staging/prod)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run verify-env-parity.py
        run: python3 scripts/verify-env-parity.py

      - name: Run verify-env-profiles.py
        run: python3 scripts/verify-env-profiles.py

  detect-changes:
    name: "Detect changes"
    runs-on: ubuntu-22.04
    outputs:
      services: ${{ steps.changes.outputs.services }}
      tests: ${{ steps.changes.outputs.tests }}
      lint: ${{ steps.changes.outputs.lint }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: bash scripts/detect-changes.sh HEAD~1

  lint-clang-tidy:
    name: "Lint — clang-tidy"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'clang-tidy')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Install clang-tidy 18
        run: pip install clang-tidy==18.1.8

      - name: Configure CMake (six-feat)
        run: |
          cmake -S services/six-feat -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure CMake (game)
        run: |
          cmake -S services/game -B build-game \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        shell: bash
        run: |
          set -o pipefail
          find libs/six-feat-*/src services/six-feat/src -name '*.cpp' | xargs -r \
            clang-tidy -p build \
              --checks='-*,readability-identifier-naming,bugprone-*,performance-*,cppcoreguidelines-*,-cppcoreguidelines-avoid-magic-numbers,-cppcoreguidelines-pro-bounds-pointer-arithmetic,-cppcoreguidelines-non-private-member-variables-in-classes,-cppcoreguidelines-pro-type-reinterpret-cast,-cppcoreguidelines-pro-type-const-cast,-cppcoreguidelines-special-member-functions,-cppcoreguidelines-pro-bounds-constant-array-index,-cppcoreguidelines-pro-type-vararg,-cppcoreguidelines-avoid-non-const-global-variables,-bugprone-easily-swappable-parameters' \
              --header-filter='six-feat-|services/six-feat' \
            2>&1 | tee clang-tidy-report.txt

      - name: Run clang-tidy (game)
        shell: bash
        run: |
          set -o pipefail
          find services/game -name '*.cpp' | xargs -r \
            clang-tidy -p build-game \
              --checks='-*,readability-identifier-naming,bugprone-*,performance-*,cppcoreguidelines-*,-cppcoreguidelines-avoid-magic-numbers,-cppcoreguidelines-pro-bounds-pointer-arithmetic,-cppcoreguidelines-non-private-member-variables-in-classes,-cppcoreguidelines-pro-type-reinterpret-cast,-cppcoreguidelines-pro-type-const-cast,-cppcoreguidelines-special-member-functions,-cppcoreguidelines-pro-bounds-constant-array-index,-cppcoreguidelines-pro-type-vararg,-cppcoreguidelines-avoid-non-const-global-variables,-bugprone-easily-swappable-parameters' \
              --header-filter='six-feat-|services/game' \
            2>&1 | tee -a clang-tidy-report.txt

      - name: Check clang-tidy report
        if: always()
        run: |
          if grep -qE '(libs/six-feat-.*/src/|services/(six-feat/|game/)).*warning:' clang-tidy-report.txt; then
            echo "::error::clang-tidy found warnings in project code"
            grep -E '(libs/six-feat-.*/src/|services/(six-feat/|game/)).*warning:' clang-tidy-report.txt
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 7

  lint-eslint:
    name: "Lint — ESLint"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'eslint')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run ESLint
        working-directory: front
        run: npm run lint

  lint-format:
    name: "Lint — Formatting"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'format')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: python3-pip python3-venv
          node-version: "20"

      - name: Install clang-format (pinned)
        run: pip install --user "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Install ruff (pinned)
        run: pip install --user "ruff==${RUFF_VERSION}"

      - name: Check C++ formatting (all files)
        run: |
          find libs services -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            | xargs clang-format --dry-run --Werror --style=file

      - name: Check Python formatting (all files)
        run: ruff format --check .

      - name: Check JS formatting (all files)
        working-directory: front
        run: |
          npm ci
          npx prettier --check "**/*.js"

      - name: Check comments (build-necessary + Russian only)
        run: python3 scripts/check_comments.py libs services tests scripts front

      - name: Check for empty source files (misapplied patch residue)
        run: python3 scripts/check-empty-sources.py

  lint-yaml:
    name: "Lint — YAML anchors"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'yaml')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install PyYAML
        run: pip install --user pyyaml
      - name: Verify YAML anchors
        run: python3 scripts/verify-yaml-anchors.py

  lint-promtool:
    name: "Lint — Prometheus rules"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'promtool')
    env:
      PROMETHEUS_VERSION: "3.9.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install promtool
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Check rules
        run: promtool check rules observability/prometheus/rules/*.yml
      - name: Check config
        working-directory: observability/prometheus
        run: promtool check config prometheus.yml

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04
    needs: detect-changes
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Run unit tests
        run: |
          /opt/testenv/bin/pytest \
            tests/test_analytics.py \
            tests/test_role_mask.py \
            tests/test_session_crypto.py \
            tests/test_migrations.py \
            tests/test_game_migrations.py \
            tests/test_component_config_parity.py \
            tests/test_include_hygiene.py \
            tests/test_deploy_local.py \
            -v --tb=short

  unit-tests-cpp:
    name: "Unit tests (C++)"
    runs-on: ubuntu-22.04
    needs: detect-changes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: build-essential cmake

      - name: Configure
        run: |
          cmake -S services/six-feat/tests/unit -B build-unit-tests \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-unit-tests -j"$(nproc)"

      - name: Run
        run: ctest --test-dir build-unit-tests --output-on-failure

  test-backup:
    name: "Test — backup/restore"
    runs-on: ubuntu-22.04
    needs: detect-changes
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      # pg_dump отказывается дампить сервер новее себя: jammy несёт client 14, сервер — 16
      - name: Install postgresql-client matching the server major
        continue-on-error: true
        run: |
          set -euo pipefail
          if command -v pg_dump >/dev/null && [ "$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')" -ge 16 ]; then
            echo "pg_dump $(pg_dump --version) already sufficient"; exit 0
          fi
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates gnupg
          install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt jammy-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Run backup/restore tests
        run: |
          /opt/testenv/bin/pytest \
            tests/test_backup_restore.py \
            tests/test_dr_drill.py \
            -v --tb=short \
            --timeout=300

  build-six-feat:
    name: "Build — six-feat"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'six-feat')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/six-feat -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: six-feat-binary
          path: /install/bin/six_feat
          retention-days: 1

  build-enrichment:
    name: "Build — enrichment"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'enrichment')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/six-feat-enrichment -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enrichment-binary
          path: /install/bin/six_feat_enrichment
          retention-days: 1

  build-genius-gateway:
    name: "Build — genius-gateway"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'genius-gateway')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/genius-gateway -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: genius-gateway-binary
          path: /install/bin/six_feat_genius_gateway
          retention-days: 1

  build-auth:
    name: "Build — auth"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'auth')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/auth -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-binary
          path: /install/bin/six_feat_auth
          retention-days: 1

  build-game:
    name: "Build — game"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'game')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/game -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-binary
          path: /install/bin/six_feat_game
          retention-days: 1

  test-six-feat:
    name: "Test — six-feat"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-enrichment, build-genius-gateway, build-auth]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'six-feat')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run six-feat tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_graph.py \
            tests/test_path.py \
            tests/test_search.py \
            tests/test_artist.py \
            tests/test_status.py \
            tests/test_sse_status.py \
            tests/test_openapi.py \
            tests/test_static_handlers.py \
            tests/test_image_proxy.py \
            tests/test_image_normalization.py \
            tests/test_rate_limit.py \
            tests/test_trace_id.py \
            tests/test_api_auth_headers.py \
            tests/test_internal_neighbours.py \
            tests/test_upsert_batching.py \
            tests/test_api_keys.py \
            tests/test_idempotency.py \
            tests/test_contract_openapi.py \
            tests/test_settings_tokens.py \
            tests/test_graph_deepen.py \
            -v --tb=short \
            --timeout=60

  explain-hot-queries:
    name: "Perf — EXPLAIN hot queries"
    runs-on: ubuntu-22.04
    needs: [detect-changes, test-six-feat]
    if: |
      always() &&
      needs.test-six-feat.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'six-feat')
    continue-on-error: true
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Run explain-hot-queries.py
        run: /opt/testenv/bin/python3 scripts/explain-hot-queries.py

  test-auth:
