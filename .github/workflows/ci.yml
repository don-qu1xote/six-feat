name: CI

on:
  push:
    branches: [main, "melidadr"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  USERVER_IMAGE_TAG: v3.0
  USERVER_IMAGE_REPO: ghcr.io/userver-framework/ubuntu-22.04-userver
  USERVER_IMAGE_DIGEST: sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
  USERVER_IMAGE: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
  POSTGRES_IMAGE: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
  K6_VERSION: "0.55.0"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Stage 0 — Detect what changed (runs in ~5 seconds)
  # ══════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: "Detect changes"
    runs-on: ubuntu-22.04
    outputs:
      services: ${{ steps.changes.outputs.services }}
      tests: ${{ steps.changes.outputs.tests }}
      lint: ${{ steps.changes.outputs.lint }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: bash scripts/detect-changes.sh HEAD~1

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1 — Lint jobs (parallel, no dependencies, ~1-2 min each)
  # ══════════════════════════════════════════════════════════════════════════
  lint-clang-tidy:
    name: "Lint — clang-tidy"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'clang-tidy')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev clang-tidy

      - name: Configure CMake (six-feat)
        run: |
          cmake -S services/six-feat -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure CMake (game)
        run: |
          cmake -S services/game -B build-game \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        shell: bash
        run: |
          set -o pipefail
          find libs/six-feat-common/src services/six-feat/src -name '*.cpp' | xargs -r \
            clang-tidy -p build \
              --checks='-*,bugprone-*,performance-*,cppcoreguidelines-*' \
              --warnings-as-errors='-*,bugprone-*,performance-*' \
            2>&1 | tee clang-tidy-report.txt

      - name: Run clang-tidy (game)
        shell: bash
        run: |
          set -o pipefail
          find services/game -name '*.cpp' | xargs -r \
            clang-tidy -p build-game \
              --checks='-*,bugprone-*,performance-*,cppcoreguidelines-*' \
              --warnings-as-errors='-*,bugprone-*,performance-*' \
            2>&1 | tee -a clang-tidy-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 7

  lint-eslint:
    name: "Lint — ESLint"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'eslint')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run ESLint
        working-directory: front
        run: npm run lint

  lint-format:
    name: "Lint — Formatting"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'format')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: clang-format python3-pip python3-venv
          node-version: "20"

      - name: Install ruff
        run: pip install --user ruff

      - name: Check C++ formatting
        run: |
          find libs services -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Check Python formatting
        run: ruff format --check tests/

      - name: Check JS formatting
        working-directory: front
        run: |
          npm ci
          npx prettier --check "src/**/*.js"

  lint-yaml:
    name: "Lint — YAML anchors"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'yaml')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install PyYAML
        run: pip install --user pyyaml
      - name: Verify YAML anchors
        run: python3 scripts/verify-yaml-anchors.py

  lint-promtool:
    name: "Lint — Prometheus rules"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.lint, 'promtool')
    env:
      PROMETHEUS_VERSION: "3.9.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install promtool
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Check rules
        run: promtool check rules observability/prometheus/rules/*.yml
      - name: Check config
        working-directory: observability/prometheus
        run: promtool check config prometheus.yml

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1 — Unit tests (no binary needed, ~30 sec)
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04
    needs: detect-changes
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Run unit tests
        run: |
          /opt/testenv/bin/pytest \
            tests/test_analytics.py \
            tests/test_role_mask.py \
            tests/test_session_crypto.py \
            tests/test_genius_mock_gateway.py \
            tests/test_genius_http_mock.py \
            tests/test_migrations.py \
            tests/test_game_migrations.py \
            -v --tb=short

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 2 — Build services (parallel, each ~3 min, upload artifacts)
  # ══════════════════════════════════════════════════════════════════════════
  build-six-feat:
    name: "Build — six-feat"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'six-feat')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/six-feat -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: six-feat-binary
          path: /install/bin/six_feat
          retention-days: 1

  build-enrichment:
    name: "Build — enrichment"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'enrichment')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/enrichment -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enrichment-binary
          path: /install/bin/six_feat_enrichment
          retention-days: 1

  build-genius-gateway:
    name: "Build — genius-gateway"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'genius-gateway')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/genius-gateway -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: genius-gateway-binary
          path: /install/bin/six_feat_genius_gateway
          retention-days: 1

  build-auth:
    name: "Build — auth"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'auth')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/auth -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-binary
          path: /install/bin/six_feat_auth
          retention-days: 1

  build-game:
    name: "Build — game"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'game')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev

      - name: Build & install
        run: |
          cmake -S services/game -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-binary
          path: /install/bin/six_feat_game
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3 — Integration tests (depends on builds, parallel per service)
  # ══════════════════════════════════════════════════════════════════════════
  test-six-feat:
    name: "Test — six-feat"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-enrichment, build-genius-gateway, build-auth]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'six-feat')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run six-feat tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_graph.py \
            tests/test_path.py \
            tests/test_search.py \
            tests/test_artist.py \
            tests/test_status.py \
            tests/test_sse_status.py \
            tests/test_openapi.py \
            tests/test_static_handlers.py \
            tests/test_image_proxy.py \
            tests/test_image_normalization.py \
            tests/test_rate_limit.py \
            tests/test_trace_id.py \
            tests/test_api_auth_headers.py \
            tests/test_internal_neighbours.py \
            tests/test_upsert_batching.py \
            -v --tb=short \
            --timeout=60

  test-auth:
    name: "Test — auth"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-auth, build-genius-gateway]
    if: |
      always() &&
      needs.build-auth.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'auth')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run auth tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_auth.py \
            tests/test_app_secret_parity.py \
            -v --tb=short \
            --timeout=60

  test-genius-gateway:
    name: "Test — genius-gateway"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-genius-gateway, build-six-feat, build-auth]
    if: |
      always() &&
      needs.build-genius-gateway.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'genius-gateway')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run genius-gateway tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_contract_gateway.py \
            -v --tb=short \
            --timeout=60

  test-health:
    name: "Test — health checks"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-enrichment, build-genius-gateway, build-auth]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'health')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run health tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_health.py \
            -v --tb=short \
            --timeout=60

  test-bg-resilience:
    name: "Test — BG resilience"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-enrichment, build-genius-gateway, build-auth]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      contains(needs.detect-changes.outputs.tests, 'bg-resilience')
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_test
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_test_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIX_FEAT_PORT: 18080
      MOCK_PORT: 18081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_test
      DB_USER: six_feat
      DB_PASSWORD: six_feat_test_password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Run BG resilience tests
        env:
          SIX_FEAT_BINARY: /install/bin/six_feat
          SIX_FEAT_ENRICHMENT_BINARY: /install/bin/six_feat_enrichment
          SIX_FEAT_GENIUS_GATEWAY_BINARY: /install/bin/six_feat_genius_gateway
          SIX_FEAT_AUTH_BINARY: /install/bin/six_feat_auth
        run: |
          /opt/testenv/bin/pytest \
            tests/test_bg_resilience.py \
            tests/test_rate_limit_store.py \
            tests/test_prune.py \
            tests/test_graceful_drain.py \
            -v --tb=short \
            --timeout=120

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3 — Frontend (parallel)
  # ══════════════════════════════════════════════════════════════════════════
  frontend-test:
    name: "Frontend — tests"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run Vitest
        working-directory: front
        run: npm run test

  frontend-coverage:
    name: "Frontend — coverage"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run coverage
        working-directory: front
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-coverage
          path: front/coverage/
          retention-days: 7

  bundle-size:
    name: "Frontend — bundle size"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build
        working-directory: front
        run: npm run build

      - name: Check bundle size
        working-directory: front
        run: npm run check-bundle-size

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 4 — Docker build + scan (parallel matrix)
  # ══════════════════════════════════════════════════════════════════════════
  docker-build-scan:
    name: "Docker — ${{ matrix.service.name }}"
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
          - name: six-feat-game
            dockerfile: services/game/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service.name }}:ci
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.service.name }}:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 5 — E2E & load tests (parallel)
  # ══════════════════════════════════════════════════════════════════════════
  e2e-smoke:
    name: "E2E smoke (Playwright)"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-genius-gateway]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      needs.build-genius-gateway.result == 'success'
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_e2e
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_e2e_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_e2e
      DB_USER: six_feat
      DB_PASSWORD: six_feat_e2e_password
      E2E_ENV_FILE: /tmp/six_feat_e2e_env.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          node-version: "20"
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Install front/ dependencies
        working-directory: front
        run: npm ci

      - name: Build front-end
        working-directory: front
        run: npm run build

      - name: Install Playwright
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          SIX_FEAT_BINARY=/install/bin/six_feat \
          SIX_FEAT_GENIUS_GATEWAY_BINARY=/install/bin/six_feat_genius_gateway \
          /opt/testenv/bin/python3 scripts/e2e_env.py up &
          echo $! > /tmp/e2e_env.pid
          for i in $(seq 1 60); do
            [ -f "$E2E_ENV_FILE" ] && break
            sleep 1
          done
          test -f "$E2E_ENV_FILE" || { echo "::error::E2E environment did not come up"; exit 1; }

      - name: Run Playwright
        working-directory: front
        run: npm run e2e

      - name: Stop services
        if: always()
        run: |
          /opt/testenv/bin/python3 scripts/e2e_env.py down || true
          kill "$(cat /tmp/e2e_env.pid)" 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

  load-test:
    name: "Load test (k6)"
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-six-feat, build-genius-gateway]
    if: |
      always() &&
      needs.build-six-feat.result == 'success' &&
      needs.build-genius-gateway.result == 'success'
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:v3.0@sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
      options: --user root
    services:
      postgres:
        image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: six_feat_ci_loadtest
          POSTGRES_USER: six_feat
          POSTGRES_PASSWORD: six_feat_ci_loadtest_password
        options: >-
          --health-cmd "pg_isready -U six_feat -d six_feat_ci_loadtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: six_feat_ci_loadtest
      DB_USER: six_feat
      DB_PASSWORD: six_feat_ci_loadtest_password
      E2E_ENV_FILE: /tmp/six_feat_ci_loadtest_env.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup
        with:
          apt-packages: libssl-dev python3 python3-pip python3-venv curl
          node-version: "20"
          python-testenv: "true"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: /install/bin
          pattern: "*-binary"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x /install/bin/*

      - name: Install k6
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k6.tar.gz \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/k6.tar.gz -C /tmp
          install -m 0755 "/tmp/k6-v${K6_VERSION}/k6" /usr/local/bin/k6

      - name: Install front/ dependencies
        working-directory: front
        run: npm ci

      - name: Build front-end
        working-directory: front
        run: npm run build

      - name: Start services
        run: |
          SIX_FEAT_BINARY=/install/bin/six_feat \
          SIX_FEAT_GENIUS_GATEWAY_BINARY=/install/bin/six_feat_genius_gateway \
          /opt/testenv/bin/python3 scripts/e2e_env.py up &
          echo $! > /tmp/e2e_env.pid
          for i in $(seq 1 60); do
            [ -f "$E2E_ENV_FILE" ] && break
            sleep 1
          done
          test -f "$E2E_ENV_FILE" || { echo "::error::Load test environment did not come up"; exit 1; }

      - name: Run k6
        env:
          PROFILE: smoke
        run: |
          chmod +x loadtest/run-all.sh
          loadtest/run-all.sh

      - name: Stop services
        if: always()
        run: |
          /opt/testenv/bin/python3 scripts/e2e_env.py down || true
          kill "$(cat /tmp/e2e_env.pid)" 2>/dev/null || true

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in loadtest/.output/*-summary.txt; do
            {
              echo '```'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: k6-summary
          path: loadtest/.output/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 6 — Publish (push/tag only, depends on all blocking jobs)
  # ══════════════════════════════════════════════════════════════════════════
  sbom:
    name: "SBOM"
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    needs:
      - lint-clang-tidy
      - lint-eslint
      - lint-format
      - lint-yaml
      - lint-promtool
      - unit-tests
      - test-six-feat
      - test-auth
      - test-genius-gateway
      - test-health
      - test-bg-resilience
      - docker-build-scan
      - e2e-smoke
      - load-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
          - name: six-feat-game
            dockerfile: services/game/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service.name }}:sbom
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.service.name }}:sbom
          format: spdx-json
          output-file: ${{ matrix.service.name }}-sbom.spdx.json
          artifact-name: ${{ matrix.service.name }}-sbom.spdx.json
          upload-artifact-retention: 90

  publish:
    name: "Publish + sign"
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    needs:
      - lint-clang-tidy
      - lint-eslint
      - lint-format
      - lint-yaml
      - lint-promtool
      - unit-tests
      - test-six-feat
      - test-auth
      - test-genius-gateway
      - test-health
      - test-bg-resilience
      - docker-build-scan
      - e2e-smoke
      - load-test
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
          - name: six-feat-game
            dockerfile: services/game/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.ref_name }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/{1}:latest', github.repository, matrix.service.name) || '' }}
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/${{ matrix.service.name }}@${DIGEST}"
