name: Uptime Check

# [SF-DOC-08] Расписание выключено намеренно. Постоянного хоста у продукта
# нет (единственная среда — машина автора, SF-INF-10), и пробник по cron
# опрашивал бы localhost раннера, где ничего не запущено: «мониторинг», который
# ничего не мониторит, но исправно зеленеет. Механизм рабочий и остаётся —
# вернуть расписание, когда появится адрес, который есть смысл проверять:
# раскомментировать schedule и задать секрет UPTIME_CHECK_URL.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: "External health check"
    runs-on: ubuntu-22.04
    env:
      # Настраивается через secrets или переменные окружения.
      # [SF-DOC-08] Путь был /api/v1/health — такого эндпоинта нет ни в одном
      # сервисе: пробник не заработал бы и на живом хосте. Реальные —
      # /healthz (процесс жив) и /readyz (готов обслуживать), проверяем второй.
      UPTIME_CHECK_URL: ${{ secrets.UPTIME_CHECK_URL || 'http://localhost:8080/readyz' }}
      UPTIME_CHECK_THRESHOLD: ${{ secrets.UPTIME_CHECK_THRESHOLD || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Restore failure state
        id: restore_state
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: /tmp/uptime-check-state.json
          key: uptime-check-state

      - name: Run uptime check
        id: check
        continue-on-error: true
        run: |
          python3 scripts/uptime-check.py \
            --url "$UPTIME_CHECK_URL" \
            --threshold "$UPTIME_CHECK_THRESHOLD" \
            --state-file /tmp/uptime-check-state.json \
            --json > /tmp/uptime-result.json

      - name: Parse result
        id: result
        run: |
          if [ -f /tmp/uptime-result.json ]; then
            cat /tmp/uptime-result.json | python3 -c "
            import json, sys
            result = json.load(sys.stdin)
            print(f\"success={str(result['success']).lower()}\")
            print(f\"consecutive_failures={result['consecutive_failures']}\")
            print(f\"should_alert={str(result['should_alert']).lower()}\")
            print(f\"message={result['message']}\")
            " >> $GITHUB_OUTPUT
          fi

      - name: Save failure state
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /tmp/uptime-check-state.json
          key: uptime-check-state

      - name: Alert on threshold
        if: steps.result.outputs.should_alert == 'true'
        run: |
          echo "::error::Uptime check failed: endpoint is DOWN after ${{ steps.result.outputs.consecutive_failures }} consecutive checks"
          exit 1

      - name: Log result
        if: always()
        run: |
          echo "Uptime check result:"
          echo "  Success: ${{ steps.result.outputs.success }}"
          echo "  Consecutive failures: ${{ steps.result.outputs.consecutive_failures }}"
          echo "  Should alert: ${{ steps.result.outputs.should_alert }}"
          echo "  Message: ${{ steps.result.outputs.message }}"
