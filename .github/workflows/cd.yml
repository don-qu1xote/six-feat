name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = репетиция всех стадий, ничего не трогает. rollback-production = передеплой последнего известного хорошего релиза."
        type: choice
        options:
          - dry-run
          - rollback-production
        default: dry-run
      rollback_sha:
        description: "Только для rollback: задеплоить этот конкретный sha вместо записанного last-good. Оставьте пустым, чтобы использовать last-good tag."
        type: string
        required: false
        default: ""
      # [SF-INF-10] `local` — машина автора, единственная реальная среда.
      # Выбран задокументированный ручной запуск `make deploy-local`, а НЕ
      # self-hosted runner: runner на домашней машине пришлось бы держать
      # включённым, регистрировать в репозитории и давать ему доступ к .env с
      # боевыми секретами — цена несопоставима с «зайти в терминал и набрать
      # одну команду». Пайплайн при target=local доводит до образов и честно
      # передаёт деплой человеку, а не изображает выкладку на несуществующий
      # хост.
      target:
        description: "Куда деплоим: remote-ssh = STAGING_HOST/PROD_HOST по SSH; local = машина автора (`make deploy-local`)."
        type: choice
        options:
          - remote-ssh
          - local
        default: remote-ssh

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  USERVER_IMAGE_REPO: ghcr.io/userver-framework/ubuntu-22.04-userver
  USERVER_IMAGE_TAG: v3.0
  USERVER_IMAGE_DIGEST: sha256:f376113b11931e838b1e32ccf9d8ea30f061d4fecfaeb8d435fc3460337d8bc0
  LAST_GOOD_TAG: cd/last-good-production

jobs:
  config:
    name: "Stage 0 — Resolve release mode"
    runs-on: ubuntu-22.04
    outputs:
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
      is_rollback: ${{ steps.mode.outputs.is_rollback }}
      image_tag: ${{ steps.mode.outputs.image_tag }}
      owner: ${{ steps.mode.outputs.owner }}
      target: ${{ steps.mode.outputs.target }}
    steps:
      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          TARGET_RAW: ${{ inputs.target }}
          OWNER_RAW: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "rollback-production" ]; then
            is_dry_run=false; is_rollback=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            is_dry_run=true;  is_rollback=false
          else
            is_dry_run=false; is_rollback=false
          fi

          owner="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          target="${TARGET_RAW:-remote-ssh}"

          {
            echo "is_dry_run=$is_dry_run"
            echo "is_rollback=$is_rollback"
            echo "image_tag=sha-$SHA"
            echo "owner=$owner"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Release mode"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| event | \`$EVENT\` |"
            echo "| dry run | \`$is_dry_run\` |"
            echo "| rollback | \`$is_rollback\` |"
            echo "| target | \`$target\` |"
            echo "| image tag | \`sha-$SHA\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: "Stage 1 — Build ${{ matrix.service.name }}"
    runs-on: ubuntu-22.04
    needs: config
    if: needs.config.outputs.is_rollback != 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/six-feat-enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
          - name: six-feat-game
            dockerfile: services/game/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build image (cache-only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          outputs: type=cacheonly
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  push:
    name: "Stage 2 — Push ${{ matrix.service.name }}"
    runs-on: ubuntu-22.04
    needs: [config, build]
    if: needs.config.outputs.is_rollback != 'true'
    permissions:
      contents: read
      packages: write   # docker push в ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: six-feat
            dockerfile: services/six-feat/Dockerfile
          - name: six-feat-auth
            dockerfile: services/auth/Dockerfile
          - name: six-feat-enrichment
            dockerfile: services/six-feat-enrichment/Dockerfile
          - name: six-feat-genius-gateway
            dockerfile: services/genius-gateway/Dockerfile
          - name: six-feat-game
            dockerfile: services/game/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        if: needs.config.outputs.is_dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ needs.config.outputs.image_tag }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ needs.config.outputs.is_dry_run != 'true' }}
          tags: ${{ env.REGISTRY }}/${{ needs.config.outputs.owner }}/${{ matrix.service.name }}:${{ needs.config.outputs.image_tag }}
          build-args: |
            USERVER_IMAGE=${{ env.USERVER_IMAGE_REPO }}:${{ env.USERVER_IMAGE_TAG }}@${{ env.USERVER_IMAGE_DIGEST }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Note dry run
        if: needs.config.outputs.is_dry_run == 'true'
        run: echo "::warning title=Dry run::Built ${{ matrix.service.name }} but did not push to ${{ env.REGISTRY }}."

  # [SF-INF-10] Единственная стадия, которая при target=local вообще что-то
  # значит. Пайплайн собрал и запушил образы — дальше деплой делает человек на
  # своей машине одной командой, и делает ЕГО ЖЕ гейтами: deploy_local.sh
  # вызывает те же cd_health_check.py и cd_smoke_test.py, что стадии 4 и 5.
  # Смысл стадии — не «сделать вид, что задеплоили», а зафиксировать в логе
  # прогона, что реальная цель этого релиза — локальная машина.
  deploy-local-handoff:
    name: "Stage 3L — Deploy: local machine (handoff)"
    runs-on: ubuntu-22.04
    needs: [config, push]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target == 'local'
    steps:
      - name: Hand the deploy over to the local machine
        env:
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
        run: |
          {
            echo "### Deploy target: local machine"
            echo ""
            echo "Образы собраны (\`$IMAGE_TAG\`). Выкладку выполняет автор на своей машине:"
            echo ""
            echo '```'
            echo "git pull && make deploy-local"
            echo '```'
            echo ""
            echo "\`make deploy-local\` поднимает тот же docker-compose.yml на не-dev"
            echo "профиле и проходит те же гейты, что стадии 4 и 5 этого пайплайна"
            echo "(\`scripts/cd_health_check.py\`, \`scripts/cd_smoke_test.py\`)."
            echo "Публичный доступ (туннель) по умолчанию выключен —"
            echo "см. docs/DEVELOPMENT.md «Как поднять у себя»."
          } >>"$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: "Stage 3 — Deploy staging"
    runs-on: ubuntu-22.04
    needs: [config, push]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    environment:
      name: staging
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      dry_run: ${{ steps.target.outputs.dry_run }}
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve staging target
        id: target
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BASE_URL_OVERRIDE: ${{ vars.STAGING_BASE_URL }}
          GLOBAL_DRY_RUN: ${{ needs.config.outputs.is_dry_run }}
        run: |
          set -euo pipefail
          if [ "$GLOBAL_DRY_RUN" = "true" ]; then
            dry_run=true
            echo "::notice title=Dry run::Rehearsing the staging deploy; no host will be contacted."
          elif [ -z "$HOST" ]; then
            dry_run=true
            echo "::warning title=STAGING_HOST is not configured::Set the STAGING_HOST secret to make this a real deploy. Validating the compose render and rehearsing the remote commands instead."
          else
            dry_run=false
          fi

          if [ -n "$BASE_URL_OVERRIDE" ]; then
            base_url="$BASE_URL_OVERRIDE"
          elif [ -n "$HOST" ]; then
            base_url="http://${HOST}:8080"
          else
            base_url=""
          fi

          {
            echo "dry_run=$dry_run"
            echo "base_url=$base_url"
          } >>"$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.target.outputs.dry_run != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=DEPLOY_SSH_KEY is not configured::STAGING_HOST is set, so a deploy key is required to reach it." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        env:
          DEPLOY_ENV: staging
          ENV_PROFILE: staging
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ needs.config.outputs.owner }}
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DRY_RUN: ${{ steps.target.outputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/cd_deploy.sh

  health-check-staging:
    name: "Stage 4 — Health check staging"
    runs-on: ubuntu-22.04
    needs: [config, deploy-staging]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Probe /readyz until ready (180s budget)
        if: needs.deploy-staging.outputs.dry_run != 'true'
        run: python3 scripts/cd_health_check.py --base-url "${{ needs.deploy-staging.outputs.base_url }}" --timeout 180

      - name: Rehearse the gate (no staging target)
        if: needs.deploy-staging.outputs.dry_run == 'true'
        run: |
          echo "::warning title=Rehearsal::No staging target; self-testing the readiness gate instead of probing."
          python3 scripts/cd_health_check.py --self-test

  smoke-staging:
    name: "Stage 5 — Smoke tests (staging)"
    runs-on: ubuntu-22.04
    needs: [config, deploy-staging, health-check-staging]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run smoke tests
        if: needs.deploy-staging.outputs.dry_run != 'true'
        run: python3 scripts/cd_smoke_test.py --base-url "${{ needs.deploy-staging.outputs.base_url }}"

      - name: Rehearse the gate (no staging target)
        if: needs.deploy-staging.outputs.dry_run == 'true'
        run: |
          echo "::warning title=Rehearsal::No staging target; self-testing the smoke scenarios instead of running them against staging."
          python3 scripts/cd_smoke_test.py --self-test

  approve-production:
    name: "Stage 6 — Manual approval"
    runs-on: ubuntu-22.04
    needs: [config, smoke-staging]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    environment:
      name: ${{ needs.config.outputs.is_dry_run == 'true' && 'production-dry-run' || 'production' }}
    steps:
      - name: Record approval
        run: |
          echo "Approved promotion of ${{ needs.config.outputs.image_tag }} to production." \
            >>"$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: "Stage 7 — Deploy production"
    runs-on: ubuntu-22.04
    needs: [config, approve-production]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    environment:
      name: ${{ needs.config.outputs.is_dry_run == 'true' && 'production-dry-run' || 'production' }}
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      dry_run: ${{ steps.target.outputs.dry_run }}
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve production target
        id: target
        env:
          HOST: ${{ secrets.PROD_HOST }}
          BASE_URL_OVERRIDE: ${{ vars.PROD_BASE_URL }}
          GLOBAL_DRY_RUN: ${{ needs.config.outputs.is_dry_run }}
        run: |
          set -euo pipefail
          if [ "$GLOBAL_DRY_RUN" = "true" ]; then
            dry_run=true
            echo "::notice title=Dry run::Rehearsing the production deploy; no host will be contacted."
          elif [ -z "$HOST" ]; then
            dry_run=true
            echo "::warning title=PROD_HOST is not configured::Set the PROD_HOST secret to make this a real deploy. Validating the compose render and rehearsing the remote commands instead."
          else
            dry_run=false
          fi

          if [ -n "$BASE_URL_OVERRIDE" ]; then
            base_url="$BASE_URL_OVERRIDE"
          elif [ -n "$HOST" ]; then
            base_url="http://${HOST}:8080"
          else
            base_url=""
          fi

          {
            echo "dry_run=$dry_run"
            echo "base_url=$base_url"
          } >>"$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.target.outputs.dry_run != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=DEPLOY_SSH_KEY is not configured::PROD_HOST is set, so a deploy key is required to reach it." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        env:
          DEPLOY_ENV: production
          ENV_PROFILE: prod
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ needs.config.outputs.owner }}
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DRY_RUN: ${{ steps.target.outputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/cd_deploy.sh

  health-check-production:
    name: "Stage 7b — Health check production"
    runs-on: ubuntu-22.04
    needs: [config, deploy-production]
    if: needs.config.outputs.is_rollback != 'true' && needs.config.outputs.target != 'local'
    permissions:
      contents: write   # двигает last-good tag; без новых секретов, GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Probe /readyz until ready (180s budget)
        if: needs.deploy-production.outputs.dry_run != 'true'
        run: python3 scripts/cd_health_check.py --base-url "${{ needs.deploy-production.outputs.base_url }}" --timeout 180

      - name: Rehearse the gate (no production target)
        if: needs.deploy-production.outputs.dry_run == 'true'
        run: |
          echo "::warning title=Rehearsal::No production target; self-testing the readiness gate instead of probing."
          python3 scripts/cd_health_check.py --self-test

      - name: Record last-good release
        if: needs.deploy-production.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git tag -f "$LAST_GOOD_TAG" "${{ github.sha }}"
          git push -f origin "refs/tags/$LAST_GOOD_TAG"
          echo "Recorded $LAST_GOOD_TAG -> ${{ github.sha }}" >>"$GITHUB_STEP_SUMMARY"

  rollback-production:
    name: "Stage 8 — Rollback production"
    runs-on: ubuntu-22.04
    needs: [config, deploy-production, health-check-production]
    if: >-
      always() && !cancelled() && needs.config.outputs.target != 'local' && (
        needs.config.outputs.is_rollback == 'true' ||
        (needs.config.outputs.is_rollback != 'true' &&
         needs.health-check-production.result == 'failure')
      )
    environment:
      name: ${{ needs.config.outputs.is_dry_run == 'true' && 'production-dry-run' || 'production' }}
    steps:
      # Для разрешения LAST_GOOD_TAG нужен tag object — shallow checkout его не забирает
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve rollback target
        id: target
        env:
          EXPLICIT_SHA: ${{ inputs.rollback_sha }}
          HOST: ${{ secrets.PROD_HOST }}
          GLOBAL_DRY_RUN: ${{ needs.config.outputs.is_dry_run }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT_SHA" ]; then
            target_sha="$EXPLICIT_SHA"
            echo "Rolling back to the explicitly requested sha $target_sha"
          elif git rev-parse -q --verify "refs/tags/$LAST_GOOD_TAG^{commit}" >/dev/null; then
            target_sha="$(git rev-parse "refs/tags/$LAST_GOOD_TAG^{commit}")"
            echo "Rolling back to $LAST_GOOD_TAG -> $target_sha"
          else
            echo "::error title=No rollback target::Neither a rollback_sha input nor the $LAST_GOOD_TAG tag is available. The tag is created by the first production release that passes its health check, so there is nothing known-good to restore yet." >&2
            exit 1
          fi

          if [ "$GLOBAL_DRY_RUN" = "true" ] || [ -z "$HOST" ]; then
            dry_run=true
          else
            dry_run=false
          fi

          {
            echo "target_sha=$target_sha"
            echo "image_tag=sha-$target_sha"
            echo "dry_run=$dry_run"
          } >>"$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.target.outputs.dry_run != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=DEPLOY_SSH_KEY is not configured::PROD_HOST is set, so a deploy key is required to reach it." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Redeploy last-good release
        env:
          DEPLOY_ENV: production
          ENV_PROFILE: prod
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ needs.config.outputs.owner }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DRY_RUN: ${{ steps.target.outputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/cd_deploy.sh

      - name: Verify the restored release is healthy
        if: steps.target.outputs.dry_run != 'true'
        run: python3 scripts/cd_health_check.py --base-url "http://${{ secrets.PROD_HOST }}:8080" --timeout 180

      - name: Rehearse the rollback verification
        if: steps.target.outputs.dry_run == 'true'
        run: |
          echo "::warning title=Rehearsal::No production target; self-testing the readiness gate instead of verifying the rollback."
          python3 scripts/cd_health_check.py --self-test

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Rollback"
            echo ""
            echo "Restored \`${{ steps.target.outputs.image_tag }}\` (commit ${{ steps.target.outputs.target_sha }})."
          } >>"$GITHUB_STEP_SUMMARY"
