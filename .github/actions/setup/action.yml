name: Toolchain setup
description: >-
  SF-CI-01: общий шаг настройки apt/node/python для джоб CI.
  Каждый input по умолчанию "выключен" (шаг пропускается).
  Вызывающие обязаны сами запустить actions/checkout до вызова этого действия.

inputs:
  apt-packages:
    description: >-
      Пакеты apt через пробел; пусто — шаг пропускается.
    required: false
    default: ""
  python-testenv:
    description: >-
      "true" — создать venv /opt/testenv и поставить
      `pip install -r config/requirements-test.txt`.
    required: false
    default: "false"
  node-version:
    description: >-
      Версия Node.js для actions/setup-node; пусто — шаг пропускается.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system deps
      if: inputs.apt-packages != ''
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
        $SUDO apt-get update -q
        $SUDO apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
        $SUDO rm -rf /var/lib/apt/lists/*

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      if: inputs.node-version != ''
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Python test dependencies
      if: inputs.python-testenv == 'true'
      shell: bash
      run: |
        python3 -m venv /opt/testenv
        /opt/testenv/bin/pip install --upgrade pip
        /opt/testenv/bin/pip install -r config/requirements-test.txt